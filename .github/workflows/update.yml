name: Update Yahoo public data and preliminary predictions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'
      - 'index.html'
  schedule:
    - cron: '17 11,17,23 * * 1,4,5,6'
    # Friday 00:20 UTC = Thursday 6:20 PM CST / 7:20 PM CDT.
    - cron: '20 0 * * 5'
    # Saturday 14:20 UTC = 8:20 AM CST / 9:20 AM CDT.
    - cron: '20 14 * * 6'
concurrency:
  group: pickmaster-data-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python scripts and website JavaScript
        run: |
          python -m py_compile scripts/build_predictions.py scripts/fetch_yahoo.py scripts/backtest.py scripts/diagnostics.py scripts/freeze_pregame.py scripts/prospective.py scripts/challenger.py scripts/compare_challenger.py scripts/freeze_thursday.py scripts/freeze_saturday.py
          python -c "from pathlib import Path; s=Path('index.html').read_text(); Path('/tmp/pickmaster-site.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/pickmaster-site.js
      - name: Fetch Yahoo public games
        run: python scripts/fetch_yahoo.py
      - name: Build preliminary free ATS projections
        run: python scripts/build_predictions.py
      - name: Audit historical ATS results
        run: python scripts/backtest.py
      - name: Diagnose performance by game factors
        run: python scripts/diagnostics.py
      - name: Freeze eligible first-seen pregame picks
        run: python scripts/freeze_pregame.py
      - name: Capture Thursday evening public reference spreads
        run: python scripts/freeze_thursday.py
      - name: Capture Saturday morning comparison against Thursday references
        run: python scripts/freeze_saturday.py
      - name: Score frozen pregame picks after final results
        run: python scripts/prospective.py
      - name: Run isolated offense-defense challenger and compare models
        run: |
          python scripts/challenger.py
          python scripts/compare_challenger.py
      - name: Commit verified updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if ! git diff --cached --quiet; then
            # Refresh the remote tip without merging separately generated JSON snapshots.
            # Keep current generated files in the worktree, then stage only data/.
            git fetch origin main
            git reset --mixed origin/main
            git add -A data/
            if ! git diff --cached --quiet; then
              git commit -m 'Update Yahoo games and preliminary ATS projections'
              git push origin HEAD:main
            fi
          fi
